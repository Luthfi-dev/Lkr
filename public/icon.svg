<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for App Icon -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#042f2e"/>
      <stop offset="60%" stopColor="#0f766e"/>
      <stop offset="100%" stopColor="#115e59"/>
    </linearGradient>

    <!-- Infinity Loop Stroke Gradient -->
    <linearGradient id="infinityGrad" x1="30" y1="120" x2="220" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2dd4bf"/>
      <stop offset="45%" stopColor="#14b8a6"/>
      <stop offset="75%" stopColor="#0d9488"/>
      <stop offset="100%" stopColor="#5eead4"/>
    </linearGradient>

    <!-- Left Person Gradient (Blue) -->
    <linearGradient id="figBlue" x1="45" y1="140" x2="75" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0284c7"/>
      <stop offset="50%" stopColor="#0ea5e9"/>
      <stop offset="100%" stopColor="#38bdf8"/>
    </linearGradient>

    <!-- Center Person Gradient (Teal / Emerald) -->
    <linearGradient id="figTeal" x1="85" y1="140" x2="105" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#059669"/>
      <stop offset="60%" stopColor="#10b981"/>
      <stop offset="100%" stopColor="#34d399"/>
    </linearGradient>

    <!-- Right Person Gradient (Green to Gold) -->
    <linearGradient id="figGold" x1="120" y1="140" x2="150" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10b981"/>
      <stop offset="60%" stopColor="#eab308"/>
      <stop offset="100%" stopColor="#f59e0b"/>
    </linearGradient>

    <!-- Star Radiant Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="40%" stopColor="#fde047"/>
      <stop offset="100%" stopColor="#eab308"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Rounded Square Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular halo -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="6 10" opacity="0.2"/>

  <!-- Centered Scaled Logo Group -->
  <g transform="translate(68, 62) scale(2.05)">
    <!-- Infinity loop outer path -->
    <path
      d="M 55 140 C 28 140 14 122 14 95 C 14 68 32 52 60 52 C 88 52 108 82 128 110 C 142 130 156 140 175 140 C 196 140 210 122 210 95 C 210 68 192 52 165 52 C 140 52 122 80 98 108"
      stroke="url(#infinityGrad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
      transform="translate(-10, -5)"
    />

    <!-- Infinity loop inner ribbon path -->
    <path
      d="M 165 60 C 142 60 126 86 108 114 C 92 136 78 145 55 145 C 32 145 15 125 15 95 C 15 65 32 46 60 46 C 85 46 106 75 125 102 C 138 122 152 132 170 132 C 192 132 205 115 205 95 C 205 72 192 58 170 58"
      stroke="#5eead4"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-opacity="0.9"
      fill="none"
      transform="translate(-10, -5)"
    />

    <!-- Left Person (Blue) -->
    <circle cx="56" cy="98" r="9.5" fill="url(#figBlue)" />
    <path
      d="M 38 136 C 43 118 52 110 58 110 C 65 110 71 116 76 98 C 78 92 75 80 80 80 C 84 80 82 94 77 106 C 71 120 64 133 53 138 Z"
      fill="url(#figBlue)"
    />

    <!-- Center Person Reaching Highest (Teal) -->
    <circle cx="92" cy="74" r="10.5" fill="url(#figTeal)" />
    <path
      d="M 80 134 C 82 114 86 94 91 88 C 95 84 98 76 104 56 C 107 48 112 53 109 66 C 104 86 100 108 96 134 Z"
      fill="url(#figTeal)"
    />

    <!-- Right Person (Green / Gold) -->
    <circle cx="128" cy="98" r="9.5" fill="url(#figGold)" />
    <path
      d="M 112 134 C 119 119 125 104 130 104 C 136 104 143 111 150 124 C 155 133 145 139 135 138 Z"
      fill="url(#figGold)"
    />

    <!-- Arc of Sparkle Dots ascending to Star -->
    <circle cx="48" cy="62" r="3.5" fill="#5eead4" opacity="0.9" />
    <circle cx="56" cy="52" r="4" fill="#5eead4" opacity="0.95" />
    <circle cx="68" cy="45" r="4" fill="#5eead4" />
    <circle cx="84" cy="42" r="4.5" fill="#5eead4" />

    <!-- Radiant Star on Top -->
    <path
      d="M 96 10 L 100 23 L 114 24 L 103 33 L 106 46 L 96 38 L 86 46 L 89 33 L 78 24 L 92 23 Z"
      fill="url(#starGlow)"
      filter="url(#glow)"
    />
  </g>
</svg>
